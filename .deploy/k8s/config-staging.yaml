server:
  port: 8080
  host: 0.0.0.0
  timeout: 30

database:
  driver: mysql
  host: ${MYSQL_HOST}
  port: ${MYSQL_PORT}
  username: ${MYSQL_USERNAME}
  password: ${MYSQL_PASSWORD}
  database: ${MYSQL_DATABASE}
  charset: utf8mb4
  max_retries: 3
  retry_delay: 5
  conn_max_lifetime: 24
  max_idle_conns: 10
  max_open_conns: 100

log:
  level: info
  format: json
  output: stdout
  max_size: 100
  max_backups: 5
  max_age: 14
  compress: true

jwt:
  secret: ${JWT_SECRET}
  expire_time: 24

cors:
  allowed_origins:
    - "https://staging.your-domain.com"
    - "http://localhost:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
  allow_credentials: true
  max_age: 86400
