basePath: /api/v1
definitions:
  models.ApprovalRequest:
    description: 工单审批请求结构
    properties:
      approval_user:
        description: 审批人
        example: 李四
        maxLength: 50
        minLength: 1
        type: string
      id:
        description: 工单ID
        example: 1
        type: integer
      memo:
        description: 审批备注
        example: 同意
        maxLength: 1000
        type: string
      next_step:
        description: 下一步骤
        example: step2
        maxLength: 100
        minLength: 1
        type: string
      operation:
        description: 审批操作
        enum:
        - approve
        - reject
        example: approve
        type: string
    required:
    - approval_user
    - id
    - next_step
    - operation
    type: object
  models.CloseTicketRequest:
    properties:
      id:
        type: integer
      memo:
        maxLength: 1000
        type: string
      operator:
        maxLength: 50
        minLength: 1
        type: string
    required:
    - id
    - operator
    type: object
  models.CloseTicketResponse:
    properties:
      id:
        type: integer
    type: object
  models.CreateTicketRequest:
    description: 创建工单请求结构
    properties:
      creator:
        description: 创建者
        example: 张三
        maxLength: 50
        minLength: 1
        type: string
      memo:
        description: 工单备注
        example: 需要请假3天
        maxLength: 1000
        type: string
      name:
        description: 工单名称
        example: 请假申请
        maxLength: 100
        minLength: 1
        type: string
      template_id:
        description: 模板ID
        example: 1
        type: integer
    required:
    - creator
    - name
    - template_id
    type: object
  models.CreateTicketResponse:
    description: 创建工单响应结构
    properties:
      id:
        description: 工单ID
        example: 1
        type: integer
    type: object
  models.DeleteTicketResponse:
    properties:
      id:
        type: integer
    type: object
  models.ErrorResponse:
    properties:
      details:
        example: 详细错误信息
        type: string
      error:
        example: 错误信息
        type: string
    type: object
  models.ListTicketResponse:
    description: 查询工单列表响应结构
    properties:
      list:
        description: 工单列表
        items:
          $ref: '#/definitions/models.TicketResponse'
        type: array
      total:
        description: 总记录数
        example: 100
        type: integer
    type: object
  models.LoginRequest:
    properties:
      password:
        example: "123456"
        maxLength: 100
        minLength: 6
        type: string
      username:
        example: admin
        maxLength: 50
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  models.LoginResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 86400
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  models.RefreshTokenRequest:
    properties:
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
    required:
    - refresh_token
    type: object
  models.RefreshTokenResponse:
    properties:
      access_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      expires_in:
        example: 86400
        type: integer
      refresh_token:
        example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        type: string
      token_type:
        example: Bearer
        type: string
    type: object
  models.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      nickname:
        example: 新用户
        maxLength: 50
        type: string
      password:
        example: "123456"
        maxLength: 100
        minLength: 6
        type: string
      username:
        example: newuser
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.TicketResponse:
    description: 工单响应结构
    properties:
      created_at:
        description: 创建时间
        example: "2025-01-27T14:30:00Z"
        type: string
      id:
        description: 工单ID
        example: 1
        type: integer
      memo:
        description: 工单备注
        example: 需要请假3天
        type: string
      operated_users:
        description: 已操作用户列表
        example:
        - 王五
        items:
          type: string
        type: array
      operators:
        description: 操作人列表
        example:
        - 张三
        - 李四
        items:
          type: string
        type: array
      order_num:
        description: 工单号
        example: TICKET-20250127143000
        type: string
      status:
        description: 工单状态
        example: running
        type: string
      step:
        description: 当前步骤
        example: submit
        type: string
      template_id:
        description: 模板ID
        example: 1
        type: integer
      uid:
        description: 工单唯一标识
        example: uid-1234567890
        type: string
      updated_at:
        description: 更新时间
        example: "2025-01-27T14:30:00Z"
        type: string
    type: object
  models.UpdateTicketRequest:
    properties:
      id:
        type: integer
      memo:
        maxLength: 1000
        type: string
    required:
    - id
    type: object
  models.UpdateTicketResponse:
    properties:
      id:
        type: integer
    type: object
  models.User:
    properties:
      avatar:
        example: https://example.com/avatar.jpg
        type: string
      created_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      deleted_at:
        type: string
      email:
        example: admin@example.com
        type: string
      id:
        example: 1
        type: integer
      last_login_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      nickname:
        example: 管理员
        type: string
      role_id:
        example: 1
        type: integer
      status:
        example: 1
        type: integer
      updated_at:
        example: "2024-01-01T00:00:00Z"
        type: string
      username:
        example: admin
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 这是一个完整的工单管理系统API，支持用户认证、工单创建、审批、模板管理等功能。
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Open Ticket System API
  version: "1.0"
paths:
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: 用户登录获取JWT token
      parameters:
      - description: 登录请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/models.LoginResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: 用户名或密码错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: 用户登录
      tags:
      - 认证
  /api/v1/auth/profile:
    get:
      consumes:
      - application/json
      description: 获取当前登录用户的详细信息
      produces:
      - application/json
      responses:
        "200":
          description: 用户信息
          schema:
            $ref: '#/definitions/models.User'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - ApiKeyAuth: []
      summary: 获取用户信息
      tags:
      - 认证
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      description: 使用refresh token获取新的access token
      parameters:
      - description: 刷新token请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RefreshTokenRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 刷新成功
          schema:
            $ref: '#/definitions/models.RefreshTokenResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: 无效的刷新令牌
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: 刷新JWT token
      tags:
      - 认证
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: 用户注册新账户
      parameters:
      - description: 注册请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: 注册成功
          schema:
            $ref: '#/definitions/models.RegisterResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: 用户名或邮箱已存在
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: 用户注册
      tags:
      - 认证
  /tickets:
    get:
      consumes:
      - application/json
      description: 分页查询工单列表，支持筛选和排序
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 10
        description: 每页数量
        in: query
        name: size
        type: integer
      - description: 工单名称
        in: query
        name: name
        type: string
      - description: 创建者
        in: query
        name: creator
        type: string
      - description: 工单状态
        in: query
        name: status
        type: string
      - description: 模板ID
        in: query
        name: template_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ListTicketResponse'
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties: true
            type: object
      summary: 查询工单列表
      tags:
      - tickets
    post:
      consumes:
      - application/json
      description: 根据模板创建新的工单
      parameters:
      - description: 创建工单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CreateTicketResponse'
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties: true
            type: object
      summary: 创建工单
      tags:
      - tickets
  /tickets/{id}:
    delete:
      consumes:
      - application/json
      description: 根据ID删除工单
      parameters:
      - description: 工单ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.DeleteTicketResponse'
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties: true
            type: object
      summary: 删除工单
      tags:
      - tickets
    get:
      consumes:
      - application/json
      description: 根据工单ID获取工单详细信息
      parameters:
      - description: 工单ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.TicketResponse'
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 工单不存在
          schema:
            additionalProperties: true
            type: object
      summary: 获取工单详情
      tags:
      - tickets
    put:
      consumes:
      - application/json
      description: 更新工单信息
      parameters:
      - description: 工单ID
        in: path
        name: id
        required: true
        type: integer
      - description: 更新工单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.UpdateTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UpdateTicketResponse'
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "404":
          description: 工单不存在
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties: true
            type: object
      summary: 更新工单
      tags:
      - tickets
  /tickets/{id}/approval:
    post:
      consumes:
      - application/json
      description: 审批工单，支持通过、拒绝等操作
      parameters:
      - description: 工单ID
        in: path
        name: id
        required: true
        type: integer
      - description: 审批请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.ApprovalRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 审批成功
          schema:
            additionalProperties: true
            type: object
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties: true
            type: object
      summary: 工单审批
      tags:
      - tickets
  /tickets/{id}/close:
    post:
      consumes:
      - application/json
      description: 关闭工单
      parameters:
      - description: 工单ID
        in: path
        name: id
        required: true
        type: integer
      - description: 关闭工单请求
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CloseTicketRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CloseTicketResponse'
        "400":
          description: 请求参数错误
          schema:
            additionalProperties: true
            type: object
        "500":
          description: 服务器内部错误
          schema:
            additionalProperties: true
            type: object
      summary: 关闭工单
      tags:
      - tickets
securityDefinitions:
  ApiKeyAuth:
    description: 请输入JWT access token，格式：Bearer {access_token}
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
