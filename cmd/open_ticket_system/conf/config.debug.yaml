server:
  port: 8080
  host: localhost
  timeout: 30

database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: 123456
  database: open_ticket_system_test
  charset: utf8mb4
  max_retries: 3
  retry_delay: 5
  conn_max_lifetime: 24
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: localhost
  port: 6379
  password: ""
  database: 0

log:
  level: debug
  logfile:
    filename: "cmd/open_ticket_system/log/open_ticket_system.log"
    maxsize: 50     # MB
    maxage: 30      # days
    maxbackups: 5
    localtime: true

accessLog:
  filename: cmd/open_ticket_system/log/access.log
  maxsize: 50     # MB
  maxage: 30      # days
  maxbackups: 5
  localtime: true

jwt:
  secret: "test-secret-key-for-testing-only"
  expire_time: 24
