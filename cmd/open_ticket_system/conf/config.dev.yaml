server:
  port: 8080
  host: localhost
  timeout: 30

database:
  driver: mysql
  host: localhost
  port: 3306
  username: root
  password: password
  database: open_ticket_system
  charset: utf8mb4
  max_retries: 3
  retry_delay: 5
  conn_max_lifetime: 24
  max_idle_conns: 10
  max_open_conns: 100

redis:
  host: localhost
  port: 6379
  password: ""
  database: 0

log:
  level: debug
  format: json
  output: stdout
  max_size: 100
  max_backups: 3
  max_age: 28
  compress: true

jwt:
  secret: "your-secret-key-here-change-in-production"
  expire_time: 24